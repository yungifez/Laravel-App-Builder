name: ci

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  control-plane:
    runs-on: ubuntu-24.04

    # Same image tags as compose.yaml. Tests only use PostgreSQL; Redis is here
    # so the job mirrors the local service set.
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: control_plane_test
          POSTGRES_PASSWORD: control_plane_test
          POSTGRES_DB: control_plane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U control_plane_test -d control_plane_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.10
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # setup-php resolves major.minor only; the exact patch used locally is
      # recorded in docs/development-baseline.md and printed below.
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, redis
          tools: composer:2.8.12
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Print toolchain versions
        run: php -v && composer --version && node -v && npm -v

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install Node dependencies
        run: npm ci

      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate --ansi

      - name: composer check:format
        run: composer check:format

      - name: composer check:types
        run: composer check:types

      - name: npm run check:format
        run: npm run check:format

      # Builds assets and generates the Wayfinder route helpers that lint,
      # type checks and the feature tests depend on.
      - name: npm run build
        run: npm run build

      - name: npm run check:lint
        run: npm run check:lint

      - name: npm run check:types
        run: npm run check:types

      - name: composer check:tests
        run: composer check:tests

  customer-app:
    runs-on: ubuntu-24.04

    # The customer-app fixture is a separate Laravel app that keeps the
    # starter's defaults (SQLite) and its own check scripts.
    defaults:
      run:
        working-directory: fixtures/customer-app

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:2.8.12
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: fixtures/customer-app/package-lock.json

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist && npm ci

      - name: Prepare environment
        run: cp .env.example .env && php artisan key:generate --ansi

      - name: npm run build
        run: npm run build

      - name: composer test
        run: composer test

      - name: npm run check
        run: npm run check

      - name: npm run types:check
        run: npm run types:check

  reference-solutions:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:2.8.12
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Verify reference solutions
        run: fixtures/reference-solutions/verify.sh --with-build

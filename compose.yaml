# Local development environment for the control plane, run with Laravel Sail
# (`vendor/bin/sail up -d`). `laravel.test` runs PHP and Node; PostgreSQL and
# Redis are trusted local services. Running only `postgres` and `redis` (and
# PHP on the host) also works.
# This file is NOT the future isolation design for customer code: it must
# never mount the Docker socket, so Sail uses the `local` workspace driver.
name: builder-control-plane

services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.4/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '127.0.0.1:${APP_PORT:-80}:80'
            - '127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    postgres:
        image: postgres:18.6
        environment:
            POSTGRES_USER: ${DB_USERNAME:-control_plane}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-control_plane}
            POSTGRES_DB: ${DB_DATABASE:-control_plane}
            TEST_DB_DATABASE: ${TEST_DB_DATABASE:-control_plane_test}
            TEST_DB_USERNAME: ${TEST_DB_USERNAME:-control_plane_test}
            TEST_DB_PASSWORD: ${TEST_DB_PASSWORD:-control_plane_test}
        ports:
            - '127.0.0.1:${FORWARD_DB_PORT:-5432}:5432'
        volumes:
            # PostgreSQL 18+ images keep PGDATA under /var/lib/postgresql/<major>/docker,
            # so the volume is mounted at /var/lib/postgresql (not .../data).
            - postgres-data:/var/lib/postgresql
            - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
                ]
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    redis:
        image: redis:8.10
        ports:
            - '127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

volumes:
    postgres-data:
    redis-data:

# Local development environment for the control plane, run with Laravel Sail
# (`vendor/bin/sail up -d`). `laravel.test` runs PHP and Node; PostgreSQL and
# Redis are trusted local services. Running only `postgres` and `redis` (and
# PHP on the host) also works.
# This file is NOT the future isolation design for customer code. Only the
# opt-in `boxes` service may mount the Docker socket, never a container that
# runs our app or customer code. `runner` stands in for a workspace box: it
# runs the box image (with the screen check's browser), gets only the runner,
# preview-tool and screen-check files and its own volume, never the project,
# .env or the database (WORKSPACE_DRIVER=runner). `reverb` rings its doorbell.
name: builder-control-plane

services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.4
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.4/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '127.0.0.1:${APP_PORT:-80}:80'
            - '127.0.0.1:${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
        volumes:
            - '.:/var/www/html'
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy

    reverb:
        image: sail-8.4/app
        user: '${WWWUSER:-1000}'
        working_dir: /var/www/html
        entrypoint:
            ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
        volumes:
            - '.:/var/www/html'
        depends_on:
            - laravel.test
        restart: unless-stopped

    runner:
        build:
            context: ./resources
            dockerfile: ../docker/box/Dockerfile
        image: builder-box
        entrypoint: ['node', '/opt/box-runner/runner.mjs']
        # A process that outlives its parent is reaped, not left as a zombie
        # under the runner (closing a workspace stops every one of them).
        init: true
        environment:
            RUNNER_URL: 'http://laravel.test'
            RUNNER_TOKEN: '${WORKSPACE_RUNNER_TOKEN:-}'
            RUNNER_ROOT: /workspaces
            RUNNER_USER: sail
        volumes:
            - './resources/box-runner:/opt/box-runner:ro'
            - './resources/agent-runner:/opt/agent-runner:ro'
            - './resources/preview-tools:/opt/preview-tools:ro'
            - './resources/trace-recorder:/opt/trace-recorder:ro'
            - './resources/screen-check/check.mjs:/opt/screen-check/check.mjs:ro'
            - box-workspaces:/workspaces
        depends_on:
            - laravel.test
        restart: unless-stopped

    # Opt in with `--profile boxes`. Only this service holds the Docker
    # socket; it creates and removes box containers and nothing else
    # (docker/boxes/server.mjs). SELinux hosts need the label disabled for
    # it to reach the socket.
    boxes:
        image: sail-8.4/app
        profiles: ['boxes']
        entrypoint: ['node', '/opt/boxes/server.mjs']
        environment:
            BOXES_TOKEN: '${WORKSPACE_BOXES_TOKEN:-}'
            BOX_IMAGE: 'builder-box'
            BOX_NETWORK: 'builder-control-plane_default'
        volumes:
            - './docker/boxes:/opt/boxes:ro'
            - '/var/run/docker.sock:/var/run/docker.sock'
        security_opt:
            - 'label:disable'
        restart: unless-stopped

    # The image each box starts from. Build it with
    # `vendor/bin/sail --profile boxes build box`; it never runs here.
    box:
        build:
            context: ./resources
            dockerfile: ../docker/box/Dockerfile
        image: builder-box
        profiles: ['boxes-image']

    postgres:
        image: postgres:18.6
        environment:
            POSTGRES_USER: ${DB_USERNAME:-control_plane}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-control_plane}
            POSTGRES_DB: ${DB_DATABASE:-control_plane}
            TEST_DB_DATABASE: ${TEST_DB_DATABASE:-control_plane_test}
            TEST_DB_USERNAME: ${TEST_DB_USERNAME:-control_plane_test}
            TEST_DB_PASSWORD: ${TEST_DB_PASSWORD:-control_plane_test}
        ports:
            - '127.0.0.1:${FORWARD_DB_PORT:-5432}:5432'
        volumes:
            # PostgreSQL 18+ images keep PGDATA under /var/lib/postgresql/<major>/docker,
            # so the volume is mounted at /var/lib/postgresql (not .../data).
            - postgres-data:/var/lib/postgresql
            - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"',
                ]
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    redis:
        image: redis:8.10
        ports:
            - '127.0.0.1:${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - redis-data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

volumes:
    box-workspaces:
    postgres-data:
    redis-data:
